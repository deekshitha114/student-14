name: Student Result Prediction Kubernetes CI CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:

  build-test-push:

    runs-on: ubuntu-latest

    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Image Tag
        id: image
        run: |
          echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build -t student-result-prediction:test .

      - name: Start Test Container
        run: |
          docker run -d \
            --name student-result-test \
            -p 8000:8000 \
            student-result-prediction:test

      - name: Test Health Endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              echo "Health test passed"
              exit 0
            fi
            sleep 2
          done

          docker logs student-result-test
          exit 1

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Automated Tests
        run: |
          pytest -q

      - name: Stop Test Container
        if: always()
        run: |
          docker rm -f student-result-test || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag student-result-prediction:test \
            ${{ steps.image.outputs.image_ref }}

          docker tag student-result-prediction:test \
            ghcr.io/${GITHUB_REPOSITORY,,}:latest

      - name: Push Docker Image
        run: |
          docker push ${{ steps.image.outputs.image_ref }}

          docker push ghcr.io/${GITHUB_REPOSITORY,,}:latest


  deploy-kubernetes:

    needs: build-test-push

    runs-on: self-hosted

    steps:

      - name: Verify Minikube
        shell: pwsh
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Create Kubernetes Deployment
        shell: pwsh
        env:
          IMAGE: ${{ needs.build-test-push.outputs.image_ref }}
        run: |
          kubectl create deployment student-result-prediction `
            --image=$env:IMAGE `
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes Service
        shell: pwsh
        run: |
          kubectl apply -f k8s/service.yaml

      - name: Update Deployment Image
        shell: pwsh
        env:
          IMAGE: ${{ needs.build-test-push.outputs.image_ref }}
        run: |
          kubectl set image deployment/student-result-prediction student-result-prediction=$env:IMAGE

      - name: Wait for Rollout
        shell: pwsh
        run: |
          kubectl rollout status deployment/student-result-prediction --timeout=180s

      - name: Verify Application Health
        shell: pwsh
        run: |
          kubectl exec deployment/student-result-prediction -- python -c "import urllib.request; print(urllib.request.urlopen('http://student-result-prediction-service/health', timeout=10).read().decode())"

      - name: Show Deployment
        shell: pwsh
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

      - name: Automatic Rollback
        if: failure()
        shell: pwsh
        run: |
          kubectl rollout undo deployment/student-result-prediction
          kubectl rollout status deployment/student-result-prediction --timeout=180s
